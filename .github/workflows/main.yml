name: GenAI API CI/CD Pipeline

# Runs every time a push is made to the main or master branch
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Check Code

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn

      - name: ✅ Run Security & Syntax Checks
        run: |
          echo "Checking syntax and preparing for deployment..."
          python -m compileall .
          echo "All checks passed! Ready for Production."


      - name: 🚀 Trigger Render Deployment
        run: |
          curl "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deployment triggered successfully!"
          