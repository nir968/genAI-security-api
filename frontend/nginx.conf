# Installed as /etc/nginx/conf.d/default.conf in the nginx-unprivileged image.
server {
    listen 8080;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers. Do not add `add_header` inside a location below: it would
    # replace these (nginx does not merge add_header across levels). Cache
    # headers therefore use `expires`.
    #  - script-src 'self': no inline scripts.
    #  - style-src 'self': the app has no inline <style>; React and Recharts set
    #    styles through the CSSOM, which CSP does not block.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Docker's embedded DNS. With a variable in proxy_pass nginx resolves the
    # name per request, so it survives a gateway container being recreated
    # (a literal name would be resolved once at startup and then go stale).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8000;

    # liveness probe for the container healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # LLM calls can be slow: allow 60s
    location = /api/chat {
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/proxy-gateway.conf;
        proxy_read_timeout 60s;
    }

    # --- endpoints the browser must never reach ---------------------------------
    # The gateway has endpoints that only the MCP security proxy uses. They are
    # protected by the X-Proxy-Token secret at the gateway, which is the real
    # control. The dashboard never needs them, so nginx also answers 404 for
    # them. That is defense in depth: if the token were ever weak, leaked or
    # unset by mistake, a page or script reaching the dashboard still could
    # not forge events, scan text, or create fake approvals through this port.
    # (A 404 rather than 403 also does not confirm that the route exists.)
    #
    # Regex locations are matched against the decoded, normalised path, so
    # %-encoding, "//", "/./" and "/../" cannot get around them. They take
    # priority over the plain "/api/" prefix below.
    #
    # The dashboard keeps exactly these four calls:
    #   GET  /api/mcp/events
    #   GET  /api/mcp/stats                 (no restriction, falls through to /api/)
    #   GET  /api/mcp/approvals?status=...
    #   POST /api/mcp/approvals/{id}/decision

    # POST /scan: the proxy's text scanner
    location ~ ^/api/scan(/.*)?$ {
        return 404;
    }

    # GET lists events; POST (writing one) is proxy-only
    location ~ ^/api/mcp/events/?$ {
        if ($request_method != GET) {
            return 404;
        }
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/proxy-gateway.conf;
        proxy_read_timeout 15s;
    }

    # GET lists approvals; POST (creating one) is proxy-only
    location ~ ^/api/mcp/approvals/?$ {
        if ($request_method != GET) {
            return 404;
        }
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/proxy-gateway.conf;
        proxy_read_timeout 15s;
    }

    # POST decides an approval: this is what the Approve / Deny buttons call
    location ~ ^/api/mcp/approvals/[^/]+/decision/?$ {
        if ($request_method != POST) {
            return 404;
        }
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/proxy-gateway.conf;
        proxy_read_timeout 15s;
    }

    # GET /mcp/approvals/{id}: the proxy polls one approval; the dashboard
    # reads the list instead
    location ~ ^/api/mcp/approvals/[^/]+/?$ {
        return 404;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        include /etc/nginx/proxy-gateway.conf;
        proxy_read_timeout 15s;
    }

    # Vite fingerprints everything in /assets, so it can be cached for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # always revalidate the entry point, so a new deploy is picked up
    location = /index.html {
        expires -1;
    }

    # single-page app: unknown paths (/events, /playground) get index.html
    location / {
        try_files $uri /index.html;
    }
}
