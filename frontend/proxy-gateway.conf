# Shared by the /api/ locations in nginx.conf: forward to the gateway.
# "/api/x" becomes "/x" (the prefix is stripped by the rewrite in the location).
proxy_pass $gateway_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# A browser must never be able to forward the proxy-only secret. An empty value
# makes nginx drop the header instead of passing it on. (The gateway still
# requires the token on its proxy-only endpoints; this just guarantees that
# nothing arriving through the dashboard port can carry one.)
proxy_set_header X-Proxy-Token "";

proxy_connect_timeout 5s;
proxy_send_timeout 15s;
