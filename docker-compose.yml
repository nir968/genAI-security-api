services:
  gateway:
    build: ./gateway
    environment:
      # SQLite file lives on the named volume so data survives restarts
      DATABASE_URL: sqlite:////data/security_gateway.db
    volumes:
      - gateway-data:/data
    ports:
      - "8000:8000"
    networks:
      - app-net
    healthcheck:
      # slim images have no curl, so use python's urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      # Resolved by Docker DNS via the service name
      GATEWAY_URL: http://gateway:8000
    ports:
      - "5001:5001"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:

volumes:
  gateway-data:
