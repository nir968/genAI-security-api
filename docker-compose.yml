services:
  gateway:
    build: ./gateway
    environment:
      # SQLite file lives on the named volume so data survives restarts
      DATABASE_URL: sqlite:////data/security_gateway.db
      # DLP policy: defaults to the file bundled in the image
      DLP_POLICY_PATH: ${DLP_POLICY_PATH:-/app/dlp/policy.yaml}
      MAX_PROMPT_CHARS: ${MAX_PROMPT_CHARS:-20000}
      # LLM used by POST /chat. The deterministic mock is the default.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      # --- Example: a local Ollama running on the host machine ---
      # (set these in your shell or in a .env file next to this compose file)
      #   LLM_PROVIDER=openai_compatible
      #   LLM_BASE_URL=http://host.docker.internal:11434/v1
      #   LLM_MODEL=llama3.2
      # On Linux, also add to this service:
      #   extra_hosts: ["host.docker.internal:host-gateway"]
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - gateway-data:/data
    ports:
      - "8000:8000"
    networks:
      - app-net
    healthcheck:
      # slim images have no curl, so use python's urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      # Resolved by Docker DNS via the service name
      GATEWAY_URL: http://gateway:8000
    ports:
      - "5001:5001"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:

volumes:
  gateway-data:
